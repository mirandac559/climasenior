name: Validação retrospectiva (SIH/DataSUS)

# Recalcula o IVC de 2014 a 2025 para todos os municípios e o compara com as internações
# de pessoas com 60+ no SIH/DataSUS. Disparo manual.
#   piloto vazio  -> Brasil inteiro (competências 2014 a 2026), grava e republica o painel
#   piloto "MA 2024" -> só o Maranhão em 2024, para conferir; grava em data/validacao_piloto (fora do painel)
on:
  workflow_dispatch:
    inputs:
      piloto:
        description: "Teste com UF(s) e ano, ex.: MA 2024 ou MA,PI 2024. Vazio = Brasil inteiro"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: validacao
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      anos: ${{ steps.m.outputs.anos }}
      ufs: ${{ steps.m.outputs.ufs }}
      ano_piloto: ${{ steps.m.outputs.ano_piloto }}
    steps:
      - id: m
        env:
          PILOTO: ${{ inputs.piloto }}
        run: |
          if [ -n "$PILOTO" ]; then
            UFS=$(echo "$PILOTO" | awk '{print $1}'); ANO=$(echo "$PILOTO" | awk '{print $2}')
            echo "anos=[$ANO]" >> "$GITHUB_OUTPUT"
            echo "ufs=$UFS" >> "$GITHUB_OUTPUT"
            echo "ano_piloto=$ANO" >> "$GITHUB_OUTPUT"
          else
            echo "anos=[2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]" >> "$GITHUB_OUTPUT"
          fi

  internacoes:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ano: ${{ fromJSON(needs.preparar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validacao.txt
      - run: pip install -r requirements-validacao.txt
      - name: Baixar e agregar o SIH
        env:
          UFS: ${{ needs.preparar.outputs.ufs }}
        run: python -m climasenior.validacao sih --ano ${{ matrix.ano }} --saida sih ${UFS:+--ufs $UFS}
      - uses: actions/upload-artifact@v4
        with:
          name: sih-${{ matrix.ano }}
          path: sih/
          retention-days: 90

  analise:
    needs: [preparar, internacoes]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validacao.txt
      - run: pip install -r requirements-validacao.txt
      - uses: actions/cache@v4
        with:
          path: cache_validacao
          key: exposicao-v1-${{ hashFiles('data/ref/celulas.csv') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sih-*
          path: sih
          merge-multiple: true
      - name: Recalcular o IVC 2014-2025 e comparar com as internações
        env:
          UFS: ${{ needs.preparar.outputs.ufs }}
          ANO: ${{ needs.preparar.outputs.ano_piloto }}
        run: |
          if [ -n "$UFS" ]; then
            python -m climasenior.validacao analisar --sih sih --ufs "$UFS" --anos "$ANO"
          else
            python -m climasenior.validacao analisar --sih sih
          fi
      - name: Registrar (e, no Brasil inteiro, republicar o painel)
        env:
          GH_TOKEN: ${{ github.token }}
          UFS: ${{ needs.preparar.outputs.ufs }}
        run: |
          git config user.name "climasenior-bot"
          git config user.email "climasenior-bot@users.noreply.github.com"
          if [ -n "$UFS" ]; then PASTA=data/validacao_piloto; else PASTA=data/validacao; fi
          git add "$PASTA"
          git diff --cached --quiet || git commit -q -m "Validação retrospectiva ${UFS:-Brasil} $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull -q --rebase && git push
          if [ -z "$UFS" ]; then gh workflow run atualizar.yml -f modo=painel; fi
