name: Testes

on:
  push:
    paths: ["climasenior/**", "tests/**", "site/**", "requirements*.txt"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-validacao.txt pytest scikit-learn joblib
      - run: python -m pytest tests -q
