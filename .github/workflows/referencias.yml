name: Atualizar capacidade de resposta (CNES)

# Estabelecimentos de atenção básica do SUS por município (CNES/DataSUS), terceiro componente do IVC.
# Muda devagar: roda uma vez por ano (15 de fevereiro) ou à mão.
on:
  schedule:
    - cron: "0 10 15 2 *"
  workflow_dispatch:
    inputs:
      explorar:
        description: "Diagnóstico do layout (ex.: EP:MA); vazio = atualizar a capacidade"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: climasenior
  cancel-in-progress: false

jobs:
  cnes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validacao.txt
      - run: pip install -r requirements-validacao.txt
      - if: inputs.explorar != ''
        run: python -m climasenior.cnes --explorar "${{ inputs.explorar }}"
      - if: inputs.explorar == ''
        run: python -m climasenior.cnes
      - name: Registrar e republicar o painel
        if: inputs.explorar == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "climasenior-bot"
          git config user.email "climasenior-bot@users.noreply.github.com"
          git add data/ref/capacidade.csv
          git diff --cached --quiet || git commit -q -m "Capacidade de resposta (CNES) $(TZ=America/Sao_Paulo date '+%F')"
          git pull -q --rebase && git push
          gh workflow run atualizar.yml -f modo=painel
