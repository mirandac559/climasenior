name: Atualizar ClimaSênior

# 06:00 de Brasília (09:00 UTC): atualização completa, com a previsão do dia.
# A cada 2 horas: completa lacunas pendentes (sai em segundos quando não há nada a fazer).
# Mudança no painel ou no cálculo: republica com os dados já gravados, sem consultar as fontes.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 */2 * * *"
  push:
    branches: [main]
    paths: ["site/index.html", "climasenior/brasil.py"]
  workflow_dispatch:
    inputs:
      modo:
        description: "completo, complemento ou painel"
        default: "completo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: climasenior
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      alterou: ${{ steps.resultado.outputs.alterou }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-operacional.txt

      - name: Instalar dependências
        run: pip install -r requirements-operacional.txt

      - name: Buscar dados e calcular o IVC
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.modo }}" = "painel" ]; then
            python -m climasenior.brasil --painel
          elif [ "${{ github.event.schedule }}" = "30 */2 * * *" ] || [ "${{ inputs.modo }}" = "complemento" ]; then
            python -m climasenior.brasil --complemento
          else
            python -m climasenior.brasil
          fi

      - name: Registrar dados e registro de execução
        if: always()
        run: |
          git config user.name "climasenior-bot"
          git config user.email "climasenior-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -q -m "Atualização $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull -q --rebase && git push

      - id: resultado
        run: echo "alterou=$([ -f .sem_alteracoes ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - if: steps.resultado.outputs.alterou == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.alterou == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: publicacao
        uses: actions/deploy-pages@v4
